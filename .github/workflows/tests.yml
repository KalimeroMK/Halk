name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel 10 and 11 are past their security-support window, so every release
      # carries an advisory and Composer refuses to install it. Lifted in this
      # throwaway test container only - deliberately not set in composer.json.
      - name: Allow installing end-of-life framework releases
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*'
        run: composer config audit.block-insecure false

      # larastan 3 needs PHP 8.2, so it is not installed for the 8.1 job
      - name: Install dependencies
        run: |
          composer remove --dev --no-update --no-interaction larastan/larastan
          composer require --no-update --no-interaction "laravel/framework:${{ matrix.laravel }}"
          composer require --no-update --no-interaction --dev "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
